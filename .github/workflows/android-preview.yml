name: Android build
on:
  workflow_dispatch:
  push:
    paths:
      - expo-source.py
      - expo-locks.py
      - backend-source.py
      - .github/workflows/android-preview.yml
permissions:
  contents: read
jobs:
  android:
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://qhsmkufaqdcpiaxwekde.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.VERTEX_PUBLISHABLE_KEY }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        client: [user, admin]
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Materialize audited independent source and dependency locks
        run: |
          python3 expo-source.py
      - name: Install dependencies
        working-directory: expo/${{ matrix.client }}
        run: npm ci --no-audit --no-fund
      - name: Local Expo prebuild (no account or token)
        working-directory: expo/${{ matrix.client }}
        env:
          CI: '1'
          EXPO_PUBLIC_SUPABASE_URL: https://qhsmkufaqdcpiaxwekde.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.VERTEX_PUBLISHABLE_KEY }}
        run: npx expo prebuild --platform android --no-install
      - name: Install native toolchain
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort | tail -1)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Build native APK (debug signature)
        working-directory: expo/${{ matrix.client }}/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers 2 -PreactNativeArchitectures=arm64-v8a assembleRelease
      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.client == 'user' && 'Smalltalk' || 'Smalltalk-Admin' }}-debug-signed
          path: expo/${{ matrix.client }}/android/app/build/outputs/apk/release/*.apk
          retention-days: 1
          if-no-files-found: error
  vertex_schema:
    concurrency:
      group: vertex-schema
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.repository == 'mceeomoba/smalltalk-chat' && github.ref == 'refs/heads/main'
    env:
      PGHOST: aws-0-us-east-1.pooler.supabase.com
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres.qhsmkufaqdcpiaxwekde
      PGSSLMODE: require
      PGPASSWORD: ${{ secrets.VERTEX_DB_PASSWORD }}
      FCM_DISPATCH_SECRET: ${{ secrets.VERTEX_FCM_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - name: Materialize Vertex-only schema
        run: python3 backend-source.py
      - name: Guard, apply atomically, and verify RLS
        run: |
          set -euo pipefail
          test -n "$PGPASSWORD"
          base=$(psql -XAt -v ON_ERROR_STOP=1 -c "select to_regclass('public.profiles') is not null;")
          if [ "$base" = f ]; then psql -X -v ON_ERROR_STOP=1 -f supabase/001_core.sql; fi
          psql -X -v ON_ERROR_STOP=1 -c "create table if not exists private.migrations(version text primary key, applied_at timestamptz not null default now()); revoke all on private.migrations from public,anon,authenticated;"
          psql -X -v ON_ERROR_STOP=1 -c "delete from private.migrations where version='013_chat_cards' and (to_regclass('public.poll_votes') is null or to_regclass('public.event_responses') is null or to_regprocedure('public.send_card(uuid,jsonb)') is null);"
          for migration in 002_live_chat 003_games_admin 004_qa_cleanup 005_private_images 006_admin_controls 007_media_qa_cleanup 008_inbox 009_pixel_qa_cleanup 010_replies_voice 011_voice_calls 012_voice_qa_cleanup 013_chat_cards 014_cards_qa_cleanup 015_status_stickers 016_status_qa_cleanup 017_fcm_devices 019_profile_settings 020_voice_metadata 021_custom_stickers 022_profile_composer_qa_cleanup 024_auth_qa_cleanup 025_owner_admin 026_profile_load_fix; do
            applied=$(psql -XAt -v ON_ERROR_STOP=1 -c "select count(*) from private.migrations where version='$migration';")
            if [ "$applied" = 0 ]; then
              test -s "supabase/$migration.sql"
              { cat "supabase/$migration.sql" | sed '$d'; echo "insert into private.migrations(version) values('$migration'); commit;"; } | psql -X -v ON_ERROR_STOP=1
            fi
          done
          test -n "$FCM_DISPATCH_SECRET"
          test -s supabase/018_fcm_dispatch.sql
          printf '\set dispatch_secret %s\n' "$FCM_DISPATCH_SECRET" > /tmp/fcm-dispatch-input.sql
          cat supabase/018_fcm_dispatch.sql >> /tmp/fcm-dispatch-input.sql
          psql -X -v ON_ERROR_STOP=1 -f /tmp/fcm-dispatch-input.sql
          rm /tmp/fcm-dispatch-input.sql
          applied=$(psql -XAt -v ON_ERROR_STOP=1 -c "select count(*) from private.migrations where version='023_push_retry';")
          if [ "$applied" = 0 ]; then { sed '$d' supabase/023_push_retry.sql; echo "insert into private.migrations(version) values('023_push_retry'); commit;"; } | psql -X -v ON_ERROR_STOP=1; fi
          curl --fail-with-body --silent --show-error -X POST 'https://qhsmkufaqdcpiaxwekde.supabase.co/functions/v1/fcm' -H "x-fcm-key: $FCM_DISPATCH_SECRET" -H 'Content-Type: application/json' -d '{}'
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare n integer;
          begin
            select count(*) into n from pg_class c join pg_namespace s on s.oid=c.relnamespace
            where s.nspname='public' and c.relname in ('profiles','rooms','room_members','messages','blocks','reports','admin_roles','bans','audit_log')
            and c.relkind='r' and c.relrowsecurity;
            if n <> 9 then raise exception 'Expected nine RLS-enabled tables, found %', n; end if;
            if has_table_privilege('anon','public.messages','select') then raise exception 'Anonymous read grant'; end if;
            if has_table_privilege('authenticated','public.messages','insert') then raise exception 'Direct message write grant'; end if;
            if has_table_privilege('authenticated','public.admin_roles','insert') then raise exception 'Client admin assignment grant'; end if;
          end$$;
          select u.id,lower(u.email) as account_email,exists(select 1 from public.admin_roles a where a.user_id=u.id) as admin_assigned from auth.users u where lower(u.email)='mceeomoba@gmail.com';
          select count(*) as synthetic_auth_accounts_remaining from auth.users where email like 'qa_auth_%@users.smalltalk.invalid' and created_at>='2026-10-04T09:00:00Z' and created_at<'2026-10-04T09:04:00Z';
          select count(*) as synthetic_accounts_remaining from auth.users where id in('826cdb65-45b2-4e1c-86c2-f442c86edf6f','13066598-ace0-4f20-a7df-4313ad9c7c19');
          select jobname,schedule,active from cron.job where jobname in('smalltalk-push-retry','smalltalk-push-cleanup');
          select status,count(*) from cron.job_run_details where start_time>now()-interval '20 minutes' group by status;
          select kind,state,count(*) as jobs from private.push_outbox group by kind,state order by kind,state;
          select status_code,count(*) as requests from net._http_response where created>now()-interval '20 minutes' group by status_code;
          select tablename, rowsecurity from pg_tables where schemaname='public' order by tablename;
          SQL
