name: Android preview
on:
  workflow_dispatch:
  push:
    paths:
      - expo-source.py
      - expo-locks.py
      - backend-source.py
      - .github/workflows/android-preview.yml
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        client: [user, admin]
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Materialize audited independent source and dependency locks
        run: |
          python3 expo-source.py
          python3 expo-locks.py
      - name: Install dependencies
        working-directory: expo/${{ matrix.client }}
        run: npm ci --no-audit --no-fund
      - name: Local Expo prebuild (no account or token)
        working-directory: expo/${{ matrix.client }}
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install
      - name: Install native toolchain
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort | tail -1)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Preview APK (generated debug signature, not production)
        working-directory: expo/${{ matrix.client }}/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers 2 -PreactNativeArchitectures=arm64-v8a assembleRelease
      - name: Upload preview only
        uses: actions/upload-artifact@v4
        with:
          name: smalltalk-${{ matrix.client }}-preview-debug-signed
          path: expo/${{ matrix.client }}/android/app/build/outputs/apk/release/*.apk
          retention-days: 1
          if-no-files-found: error
  vertex_schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.repository == 'mceeomoba/smalltalk-chat' && github.ref == 'refs/heads/main'
    env:
      PGHOST: aws-0-us-east-1.pooler.supabase.com
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres.qhsmkufaqdcpiaxwekde
      PGSSLMODE: require
      PGPASSWORD: ${{ secrets.VERTEX_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Materialize Vertex-only schema
        run: python3 backend-source.py
      - name: Guard, apply atomically, and verify RLS
        run: |
          test -n "$PGPASSWORD"
          existing=$(psql -XAt -v ON_ERROR_STOP=1 -c "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE';")
          if [ "$existing" = 0 ]; then
            psql -X -v ON_ERROR_STOP=1 -f supabase/001_core.sql
          elif [ "$existing" != 9 ]; then
            echo "Unexpected public schema. Stopping without mutation."
            exit 1
          fi
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare n integer;
          begin
            select count(*) into n from pg_class c join pg_namespace s on s.oid=c.relnamespace
            where s.nspname='public' and c.relname in ('profiles','rooms','room_members','messages','blocks','reports','admin_roles','bans','audit_log')
            and c.relkind='r' and c.relrowsecurity;
            if n <> 9 then raise exception 'Expected nine RLS-enabled tables, found %', n; end if;
            if has_table_privilege('anon','public.messages','select') then raise exception 'Anonymous read grant'; end if;
            if has_table_privilege('authenticated','public.messages','insert') then raise exception 'Direct message write grant'; end if;
            if has_table_privilege('authenticated','public.admin_roles','insert') then raise exception 'Client admin assignment grant'; end if;
          end$$;
          select tablename, rowsecurity from pg_tables where schemaname='public' order by tablename;
          SQL
